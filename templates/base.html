<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Plan a wedding, birthday or community event: budget split, countdown timeline, vendor checklist and ideas.">
  <title>{% block title %}Utsav - Celebration & Event Planner{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%238B1E3F'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#8B1E3F',
            'primary-dark': '#6B1530',
            accent: '#F5B83D',
            'accent-ink': '#3B0A1A',
            ink: '#1F1720',
            muted: '#5B5160',
            panel: '#F7F4F5',
            'panel-border': '#E4DDE0',
            'status-urgent-text': '#B42318',
            'status-urgent-bg': '#FEF3F2',
            'status-compressed-text': '#B54708',
            'status-compressed-bg': '#FFFAEB',
            'status-upcoming-text': '#067647',
            'status-upcoming-bg': '#ECFDF3'
          },
          fontFamily: {
            serif: ['Fraunces', 'serif'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --primary: #8B1E3F;
      --primary-dark: #6B1530;
      --accent: #F5B83D;
      --ink: #1F1720;
      --muted: #5B5160;
      --panel: #F7F4F5;
      --border: #E4DDE0;
    }
    .h1-hero {
      font-family: 'Fraunces', serif !important;
      font-weight: 700 !important;
      font-size: clamp(2.25rem, 5vw, 3.5rem) !important;
      line-height: 1.15 !important;
      color: #1F1720 !important;
    }
    .h2-title {
      font-family: 'Fraunces', serif !important;
      font-weight: 700 !important;
      font-size: 2rem !important;
      line-height: 1.25 !important;
      color: #1F1720 !important;
    }
    .body-lead {
      font-family: 'Inter', sans-serif !important;
      font-size: 1.0625rem !important;
      line-height: 1.65 !important;
      max-width: 65ch !important;
      color: #5B5160 !important;
    }
    .btn-primary {
      min-height: 48px !important;
      height: 48px !important;
      padding: 0 1.5rem !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      border-radius: 8px !important;
      font-family: 'Inter', sans-serif !important;
      font-weight: 600 !important;
      font-size: 1rem !important;
      text-decoration: none !important;
      background-color: #8B1E3F !important;
      color: #ffffff !important;
      border: 1px solid #8B1E3F !important;
      cursor: pointer !important;
      transition: background-color 0.15s ease !important;
    }
    .btn-primary:hover {
      background-color: #6B1530 !important;
      border-color: #6B1530 !important;
    }
    .btn-secondary {
      min-height: 48px !important;
      height: 48px !important;
      padding: 0 1.5rem !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      border-radius: 8px !important;
      font-family: 'Inter', sans-serif !important;
      font-weight: 600 !important;
      font-size: 1rem !important;
      text-decoration: none !important;
      background-color: #ffffff !important;
      color: #8B1E3F !important;
      border: 2px solid #8B1E3F !important;
      cursor: pointer !important;
      transition: background-color 0.15s ease !important;
    }
    .btn-secondary:hover {
      background-color: #F7F4F5 !important;
      color: #6B1530 !important;
    }
    .utsav-card {
      background-color: #ffffff !important;
      border: 1px solid #E4DDE0 !important;
      border-radius: 12px !important;
    }
    .section-rhythm-white {
      background-color: #ffffff !important;
      padding-top: 40px !important;
      padding-bottom: 40px !important;
    }
    .section-rhythm-panel {
      background-color: #F7F4F5 !important;
      padding-top: 40px !important;
      padding-bottom: 40px !important;
    }
    @media (min-width: 768px) {
      .section-rhythm-white,
      .section-rhythm-panel {
        padding-top: 64px !important;
        padding-bottom: 64px !important;
      }
    }
    .content-container {
      max-width: 1120px !important;
      margin-left: auto !important;
      margin-right: auto !important;
      padding-left: 1rem !important;
      padding-right: 1rem !important;
    }
    @media (min-width: 640px) {
      .content-container {
        padding-left: 1.5rem !important;
        padding-right: 1.5rem !important;
      }
    }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v=20261023_rev6">
</head>
<body class="bg-white text-ink font-sans min-h-screen flex flex-col antialiased">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="border-b border-[#E4DDE0] bg-white sticky top-0 z-30">
    <div class="max-w-[1120px] mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-8">
        <a href="/" class="text-2xl font-serif font-bold text-primary tracking-tight">Utsav</a>
        <nav aria-label="Main" class="flex items-center gap-6">
          <a href="/" class="text-sm font-medium transition-colors hover:text-primary {% if request.path == '/' %}text-primary border-b-2 border-primary py-5 font-semibold{% else %}text-muted{% endif %}" {% if request.path == '/' %}aria-current="page"{% endif %}>Home</a>
          <a href="/create" class="text-sm font-medium transition-colors hover:text-primary {% if request.path == '/create' or request.path == '/plan' %}text-primary border-b-2 border-primary py-5 font-semibold{% else %}text-muted{% endif %}" {% if request.path == '/create' or request.path == '/plan' %}aria-current="page"{% endif %}>Plan an event</a>
          <a href="/about" class="text-sm font-medium transition-colors hover:text-primary {% if request.path == '/about' %}text-primary border-b-2 border-primary py-5 font-semibold{% else %}text-muted{% endif %}" {% if request.path == '/about' %}aria-current="page"{% endif %}>About</a>
        </nav>
      </div>
      <div>
        <a href="/create" class="hidden md:inline-flex btn-primary !min-h-[40px] !h-10 px-4 py-2 text-sm font-semibold rounded-lg bg-[#8B1E3F] text-white hover:bg-[#6B1530] transition-colors items-center justify-center">Start planning</a>
      </div>
    </div>
  </header>

  <main id="main-content" tabindex="-1" class="flex-grow w-full outline-none">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-[#E4DDE0] bg-[#F7F4F5] py-8 text-center text-sm text-muted">
    <div class="max-w-[1120px] mx-auto px-4 sm:px-6 space-y-2">
      <p>Utsav gives planning suggestions. Vendor prices vary by city and season, so confirm quotes directly with vendors.</p>
      <p class="text-xs">Built with Python, Flask and Google Gemini.</p>
    </div>
  </footer>

  <div id="live-status" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <script src="{{ url_for('static', filename='js/common.js') }}?v=20261023_rev6" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
